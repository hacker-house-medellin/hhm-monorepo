[package]
org = "hacker-house-medellin"
name = "hhm-monorepo"
version = "0.1.0"
description = "High-context development monorepo for Hacker House Medellín"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-monorepo"

[install]
adapter = "none"
dir = ".vendor/.zed"

[dependencies]
# Exact gitlinks own deployment composition until these packages are published
# to the Zed registry.

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".zed/**", ".vendor/.zed/**", "apps/deployments/**"]

[targets.repository]
dir = "."

[scripts]
test = "bash scripts/test.sh"
